name: Controlled Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact v<version> tag (required only for publication)'
        required: false
        type: string
      publish:
        description: 'Request protected GitHub Release publication after qualification'
        required: false
        default: false
        type: boolean
      prior_run_id:
        description: 'Completed candidate run containing the prior Windows standalone version for upgrade qualification'
        required: false
        type: string
      artifact_run_id:
        description: 'Completed qualified Windows run to publish without rebuilding (required for publication)'
        required: false
        type: string
      evidence_ref:
        description: 'Repository ref containing additional exact Windows artifact evidence'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: '!inputs.publish'
    name: Windows bundle / Node 24
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run release:artifacts
        id: bundle
      - name: Include installation scripts
        shell: pwsh
        run: Copy-Item install.ps1 -Destination release-artifacts
      - name: Qualify the exact standalone archive
        if: inputs.prior_run_id == ''
        run: node dist/scripts/bundle-smoke.js --directory release-artifacts
      - name: Download exact prior Windows version
        if: inputs.prior_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-win32-x64
          path: prior-artifacts
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Qualify exact upgrade and rollback
        if: inputs.prior_run_id != ''
        run: node dist/scripts/bundle-smoke.js --directory release-artifacts --previous-directory prior-artifacts
      - name: Retain exact prior bytes for publication verification
        if: inputs.prior_run_id != ''
        run: node -e "require('node:fs').cpSync('prior-artifacts','release-artifacts/previous',{recursive:true})"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always() && steps.bundle.outcome == 'success'
        with:
          name: standalone-win32-x64
          path: release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    name: Publish approved Windows release
    needs: prepare
    if: always() && inputs.publish && inputs.tag != '' && inputs.artifact_run_id != ''
    runs-on: windows-latest
    environment: github-release-production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tools:compile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-win32-x64
          path: release-artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.evidence_ref || github.ref }}
          path: qualification-evidence
      - name: Collect matching external qualification records
        run: node dist/scripts/collect-release-evidence.js --artifacts release-artifacts --evidence qualification-evidence/.github/release-evidence
      - name: Verify qualified bytes against the existing tag commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node dist/scripts/release-artifacts.js --verify-only --tag "$env:RELEASE_TAG" --output release-artifacts
      - name: Publish the verified artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath release-artifacts -File | ForEach-Object FullName
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "$env:RELEASE_TAG" --generate-notes
