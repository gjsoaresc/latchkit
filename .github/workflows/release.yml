name: Controlled release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact v<version> tag (required only for publication)'
        required: false
        type: string
      publish:
        description: 'Request protected GitHub Release publication after qualification'
        required: false
        default: false
        type: boolean
      prior_run_id:
        description: 'Completed candidate run containing the prior standalone version for upgrade qualification'
        required: false
        type: string
      artifact_run_id:
        description: 'Completed qualified run to publish without rebuilding (required for publication)'
        required: false
        type: string
      evidence_ref:
        description: 'Repository ref containing additional exact-artifact evidence, such as Windows 11 and live delivery'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: '!inputs.publish'
    name: Native bundle / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install archive verification tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm run check
      - run: npm test
      - run: npm run release:artifacts
      - name: Include installation scripts
        shell: bash
        run: cp install.sh install.ps1 release-artifacts/
      - name: Qualify the exact standalone archive
        if: inputs.prior_run_id == ''
        run: node scripts/bundle-smoke.js --directory release-artifacts
      - name: Download exact prior version
        if: inputs.prior_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-${{ matrix.target }}
          path: prior-artifacts
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Qualify exact upgrade and rollback
        if: inputs.prior_run_id != ''
        run: node scripts/bundle-smoke.js --directory release-artifacts --previous-directory prior-artifacts
      - name: Retain exact prior bytes for publication verification
        if: inputs.prior_run_id != ''
        run: node -e "require('node:fs').cpSync('prior-artifacts','release-artifacts/previous',{recursive:true})"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: standalone-${{ matrix.target }}
          path: release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  ubuntu-22-smoke:
    name: Exact Linux bundle / Ubuntu 22.04
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-linux-x64
          path: release-artifacts
      - run: node scripts/bundle-smoke.js --directory release-artifacts
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qualification-ubuntu22
          path: release-artifacts/*.evidence.json
          if-no-files-found: error
  wsl-artifact-smoke:
    name: Exact Linux bundle / WSL / mounted drive
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-linux-x64
          path: release-artifacts
      - name: Require actual WSL and qualify using the bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wsl --status
          if ($LASTEXITCODE -ne 0) { throw 'WSL is required for this qualification cell.' }
          $distros = ((wsl --list --quiet | Out-String) -replace "`0", '')
          if ($distros -notmatch 'Ubuntu') { wsl --install --distribution Ubuntu --no-launch }
          $repo = (wsl -d Ubuntu -- wslpath -a '${{ github.workspace }}').Trim()
          wsl -d Ubuntu -- sh "$repo/scripts/wsl-bundle-smoke.sh" "$repo"
          if ($LASTEXITCODE -ne 0) { throw 'WSL exact bundle qualification failed.' }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qualification-wsl
          path: release-artifacts/*.wsl.evidence.json
          if-no-files-found: error
  publish:
    name: Publish approved GitHub Release
    needs: [prepare, ubuntu-22-smoke, wsl-artifact-smoke]
    if: always() && inputs.publish && inputs.tag != '' && inputs.artifact_run_id != ''
    runs-on: ubuntu-24.04
    environment: github-release-production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: standalone-*
          path: release-artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qualification-*
          path: release-artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.evidence_ref || github.ref }}
          path: qualification-evidence
      - name: Collect matching external qualification records
        run: node scripts/collect-release-evidence.js --artifacts release-artifacts --evidence qualification-evidence/.github/release-evidence
      - name: Install archive verification tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Verify qualified bytes against the existing tag commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-artifacts.js --verify-only --tag "$RELEASE_TAG" --output release-artifacts
      - name: Publish the verified artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-artifacts -maxdepth 1 -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes
