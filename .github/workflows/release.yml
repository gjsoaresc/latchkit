name: Controlled release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact v<version> tag (required only for publication)'
        required: false
        type: string
      publish:
        description: 'Request protected GitHub Release publication after qualification'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  prepare:
    name: Native bundle / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned BAML (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/setup-baml.ps1
      - name: Install pinned BAML (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/setup-baml.sh
      - run: npm run check
      - run: npm test
      - run: npm run release:artifacts
      - name: Include installation scripts
        shell: bash
        run: cp install.sh install.ps1 release-artifacts/
      - name: Qualify the exact standalone archive
        run: node scripts/bundle-smoke.js --directory release-artifacts
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: standalone-${{ matrix.target }}
          path: release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  ubuntu-24-smoke:
    name: Exact Linux bundle / Ubuntu 24.04
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-linux-x64
          path: release-artifacts
      - run: node scripts/bundle-smoke.js --directory release-artifacts
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qualification-ubuntu24
          path: release-artifacts/*.evidence.json
          if-no-files-found: error
  wsl-artifact-smoke:
    name: Exact Linux bundle / WSL / mounted drive
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-linux-x64
          path: release-artifacts
      - name: Require actual WSL and qualify using the bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wsl --status
          if ($LASTEXITCODE -ne 0) { throw 'WSL is required for this qualification cell.' }
          $distros = ((wsl --list --quiet | Out-String) -replace "`0", '')
          if ($distros -notmatch 'Ubuntu') { wsl --install --distribution Ubuntu --no-launch }
          $repo = (wsl -d Ubuntu -- wslpath -a '${{ github.workspace }}').Trim()
          wsl -d Ubuntu -- sh "$repo/scripts/wsl-bundle-smoke.sh" "$repo"
          if ($LASTEXITCODE -ne 0) { throw 'WSL exact bundle qualification failed.' }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qualification-wsl
          path: release-artifacts/*.wsl.evidence.json
          if-no-files-found: error
  publish:
    name: Publish approved GitHub Release
    needs: [prepare, ubuntu-24-smoke, wsl-artifact-smoke]
    if: inputs.publish && inputs.tag != ''
    runs-on: ubuntu-24.04
    environment: github-release-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: standalone-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qualification-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify qualified bytes against the existing tag commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-artifacts.js --verify-only --tag "$RELEASE_TAG" --output release-artifacts
      - name: Publish the verified artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --title "$RELEASE_TAG" --generate-notes
