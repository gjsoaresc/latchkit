name: Windows CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm ci --ignore-scripts
      - name: Audit build and bundled browser dependencies
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Installed artifact smoke
        run: npm run smoke:artifact -- --require-links

  browser:
    name: Browser console / Windows Chromium
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser -- --project=chromium
      - name: Retain sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-windows-chromium
          path: test-results/acceptance-*/.latchkit/tasks/acceptance-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
