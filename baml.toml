[package]
name = "latchkit"

[generator.typescript]
output_type = "typescript/node"
naming_convention = "preserve-case"
output_dir = "src"

# Production generation reads only baml_src. scripts/baml.js stages baml_tests
# alongside these files only for `baml test`, keeping emitted bytecode portable.

# scripts/baml.js enforces this exact toolchain using BAML_VERSION.
# The 0.2.4 Windows wrapper does not implement `toolchain pin`.
